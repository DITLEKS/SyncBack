# Дополнение для локальной разработки: открывает порты инфраструктуры на хост,
# чтобы подключаться к Postgres/Redis/SeaweedFS с машины разработчика.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  seaweedfs:
    ports:
      - "127.0.0.1:8333:8333"
