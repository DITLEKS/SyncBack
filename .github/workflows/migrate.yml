name: Migrate

# Миграции production-БД. Job привязан к GitHub Environment «production»:
# в настройках репозитория (Settings → Environments → production) должны быть
# включены required reviewers — тогда каждый запуск ждёт ручного подтверждения.
# Запускается при изменении миграций/моделей в main или вручную.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Миграция запускается только если изменились alembic-файлы или модели.
      - "alembic/versions/**.py"
      - "alembic/env.py"
      - "app/infrastructure/db/models/**.py"

# Не запускать параллельно: только одна миграция за раз на каждый environment.
concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    environment: production          # GitHub Environment — здесь хранятся secrets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Secrets задаются в Settings → Environments → production.
      # alembic/env.py читает только DATABASE_URL.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      - name: Show pending migrations (dry-run info)
        run: alembic history --indicate-current
        continue-on-error: true     # не падаем, если БД ещё недоступна на этом шаге

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify current revision
        run: alembic current
