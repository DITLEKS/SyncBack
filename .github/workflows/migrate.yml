name: Migrate

# Запускается только после успешного прогона CI на main.
# Для деплоя на другие окружения — добавить отдельные jobs с environment.
on:
  push:
    branches: [main]
    paths:
      # Миграция запускается только если изменились alembic-файлы или модели.
      - "alembic/versions/**.py"
      - "alembic/env.py"
      - "app/infrastructure/db/models/**.py"

# Не запускать параллельно: только одна миграция за раз на каждый environment.
concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    environment: production          # GitHub Environment — здесь хранятся secrets

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Secrets задаются в Settings → Environments → production.
      # alembic/env.py строит Settings целиком, поэтому нужны все обязательные
      # поля (имена совпадают с app/core/config.py); реально используется
      # только DATABASE_URL.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          EOF

      - name: Show pending migrations (dry-run info)
        run: alembic history --indicate-current
        continue-on-error: true     # не падаем, если БД ещё недоступна на этом шаге

      - name: Run migrations
        run: alembic upgrade head

      - name: Verify current revision
        run: alembic current
