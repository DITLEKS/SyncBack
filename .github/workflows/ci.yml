name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncscribe
          POSTGRES_PASSWORD: syncscribe
          POSTGRES_DB: syncscribe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=syncscribe -e MINIO_ROOT_PASSWORD=syncscribe123 \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 20); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Create MinIO bucket
        run: |
          docker run --rm --network host minio/mc:latest sh -c "
            mc alias set local http://localhost:9000 syncscribe syncscribe123 &&
            mc mb -p local/syncscribe-documents &&
            mc anonymous set none local/syncscribe-documents
          "

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_HOST=postgres/POSTGRES_HOST=localhost/' .env
          sed -i 's#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@postgres:5432/syncscribe#DATABASE_URL=postgresql+asyncpg://syncscribe:syncscribe@localhost:5432/syncscribe#' .env
          sed -i 's#REDIS_URL=redis://redis:6379/0#REDIS_URL=redis://localhost:6379/0#' .env
          sed -i 's/MINIO_ENDPOINT=minio:9000/MINIO_ENDPOINT=localhost:9000/' .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration -v

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t syncscribe-backend:ci .

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t syncscribe-worker:ci .
