[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncscribe-backend"
version = "0.1.0"
description = "SyncScribe MVP backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "minio>=7.2",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7,<1.8",
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
    "python-magic>=0.4",
    "greenlet>=3.0",
    "email-validator>=2.1",
    "hiredis>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI требует вызывать Depends()/File()/Form() именно как значения по умолчанию
# аргументов — это официальный паттерн самого FastAPI, а не баг вызова функции в
# сигнатуре. Помечаем эти вызовы как "immutable", чтобы B008 не срабатывал ся
# ложноположительно на каждом роутере и каждой DI-фабрике.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# UP042 предлагает заменить `class X(str, enum.Enum)` на `enum.StrEnum`. Формально
# доступно с Python 3.12, но меняет поведение str(member): было "X.ADMIN", станет
# "admin". Это может незаметно изменить сериализацию в логах и местах, где enum
# приводится к строке через str()/f-string, а не через .value. Осознанно откладываем
# эту миграцию как отдельную задачу с ревью всех мест использования, а не делаем
# вслепую в рамках чистки линтера.
"app/infrastructure/db/models/enums.py" = ["UP042"]

# UP046 предлагает заменить `class Page(BaseModel, Generic[T])` на PEP 695-синтаксис
# `class Page[T](BaseModel)`. Не переходим на него вслепую: в pyproject.toml зафиксирован
# `pydantic>=2.7` без верхней границы, а полная поддержка PEP 695 для генерик-моделей
# BaseModel появилась не с самой ранней версии 2.x. Старый синтаксис через TypeVar/Generic
# остаётся валидным и совместимым с широким диапазоном версий, миграция на PEP 695 —
# отдельная задача после фиксации минимальной версии pydantic.
"app/api/schemas/pagination.py" = ["UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
