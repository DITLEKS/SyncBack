name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare test environment
        run: |
          # ИСПРАВЛЕНО: Settings() требует обязательные поля (DATABASE_URL,
          # REDIS_URL, MINIO_*, JWT_SECRET) без дефолтов. Без .env простой импорт app.main
          # (через test_app_startup.py) падал с pydantic.ValidationError ещё до запуска
          # тестов. Значения из .env.example — безопасные заглушки (LLM_PROVIDER=stub и т.д.),
          # реального подключения к Postgres/Redis/MinIO для unit-тестов не требуется —
          # асинхронный движок создаётся лениво и не подключается при импорте.
          cp .env.example .env

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Run unit tests
        run: pytest tests/unit -v

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t syncscribe-backend:ci .

      - name: Build worker image
        run: docker build -f docker/worker.Dockerfile -t syncscribe-worker:ci .
